    const pageContent=document.getElementById("pageContent");
    let activeDeckIndex=-1;
    let activeModuleNumber=1;
    let activeSlide=0;
    const escapeHtml=(value)=>String(value).replace(/[&<>"']/g,(character)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character]));
    const initials=(name)=>name.trim().split(/\s+/).slice(0,2).map((part)=>part[0]).join("").toUpperCase()||"S";
    const moduleCards=()=>modules.map((module,index)=>`<article class="card content-card module-card"><div class="module-number">0${index+1}</div><div class="card-kicker">${escapeHtml(module.tag)}</div><h3>${escapeHtml(module.title)}</h3><p>${escapeHtml(module.description)}</p><div class="progress-track" aria-label="Not started"><span style="width:0%"></span></div>${index<2?`<button class="primary-button module-open" data-goto="module-${index+1}">Open Module ${index+1}</button>`:""}</article>`).join("");
    const getActiveDecks=()=>activeModuleNumber===2?moduleTwoDecks:moduleOneDecks;
    function renderFlipPage(){
      const deck=getActiveDecks()[activeDeckIndex];
      if(!deck)return;
      const leftPage=document.getElementById("leftNotebookPage");
      const rightPage=document.getElementById("rightNotebookPage");
      leftPage.src=`modules/module-${activeModuleNumber}/${deck.slug}/Slide ${activeSlide+1}.PNG`;
      leftPage.alt=`${deck.title}, page ${activeSlide+1}`;
      document.getElementById("leftPageNumber").textContent=`${activeSlide+1}`;
      document.querySelectorAll(".notebook-page-label").forEach((label)=>label.textContent=`DATA SCIENCE · MODULE ${activeModuleNumber}`);
      const rightSlide=activeSlide+2;
      const rightLeaf=document.getElementById("rightNotebookLeaf");
      rightLeaf.classList.toggle("is-empty",rightSlide>deck.slides);
      if(rightSlide<=deck.slides){
        rightPage.src=`modules/module-${activeModuleNumber}/${deck.slug}/Slide ${rightSlide}.PNG`;
        rightPage.alt=`${deck.title}, page ${rightSlide}`;
      }else{
        rightPage.removeAttribute("src");
        rightPage.alt="";
      }
      document.getElementById("rightPageNumber").textContent=rightSlide<=deck.slides?`${rightSlide}`:"";
      document.getElementById("flipbookTitle").textContent=deck.title;
      document.getElementById("flipbookCount").textContent=rightSlide<=deck.slides?`Pages ${activeSlide+1}–${rightSlide} of ${deck.slides}`:`Page ${activeSlide+1} of ${deck.slides}`;
      document.getElementById("previousSlide").disabled=activeSlide===0;
      document.getElementById("nextSlide").disabled=rightSlide>=deck.slides;
      document.getElementById("previousSlideButton").disabled=activeSlide===0;
      document.getElementById("nextSlideButton").disabled=rightSlide>=deck.slides;
    }
    function openFlipbook(index){
      const selectedDecks=getActiveDecks();
      if(!Number.isInteger(index)||index<0||index>=selectedDecks.length)return;
      activeDeckIndex=index;
      activeSlide=0;
      document.getElementById("flipbookViewer").hidden=false;
      renderFlipPage();
      document.getElementById("flipbookViewer").scrollIntoView({behavior:"smooth",block:"start"});
    }
    function turnFlipbookPage(direction){
      const deck=getActiveDecks()[activeDeckIndex];
      const spread=document.getElementById("notebookSpread");
      if(!deck||spread.querySelector(".notebook-turn-page"))return;
      const nextSlide=Math.max(0,Math.min(Math.floor((deck.slides-1)/2)*2,activeSlide+direction*2));
      if(nextSlide===activeSlide)return;
      const turningForward=direction>0;
      const turnPage=document.createElement("div");
      turnPage.className=`notebook-turn-page ${turningForward?"forward":"backward"}`;
      const frontImage=document.createElement("img");
      const backImage=document.createElement("img");
      const currentPage=activeSlide+(turningForward?2:1);
      const revealedPage=turningForward?nextSlide+1:activeSlide;
      frontImage.src=`modules/module-${activeModuleNumber}/${deck.slug}/Slide ${currentPage}.PNG`;
      frontImage.alt="";
      backImage.src=`modules/module-${activeModuleNumber}/${deck.slug}/Slide ${revealedPage}.PNG`;
      backImage.alt="";
      for(const [side,image] of [["front",frontImage],["back",backImage]]){
        const face=document.createElement("div");
        face.className=`notebook-page-face ${side}`;
        face.appendChild(image);
        turnPage.appendChild(face);
      }
      turnPage.addEventListener("animationend",()=>{
        activeSlide=nextSlide;
        turnPage.remove();
        renderFlipPage();
      },{once:true});
      spread.appendChild(turnPage);
    }
    function setPage(page){
      document.querySelectorAll(".nav-button").forEach((button)=>button.classList.toggle("active",button.dataset.page===page||(page==="module-1"&&button.dataset.page==="modules")));
      document.getElementById("sidebar").classList.remove("open");
      const title={home:"Student dashboard",modules:"Your modules","module-1":"Module 1 flipbook",labs:"Lab assignments",tools:"Data science tools",resources:"Learning resources",ai:"AI study assistant",profile:"Student profile"}[page]||"Student dashboard";
      document.getElementById("topbarTitle").textContent=title;
      if(page==="home"){
        pageContent.innerHTML=`<div class="welcome-card"><div><span class="eyebrow">Your digital study space</span><h2>Good to have you here, ${escapeHtml(state.name)}.</h2><p>Pick up where you left off, explore a module, or get started with your next data science lab.</p></div><div class="welcome-stat"><strong>05</strong><span>learning modules</span></div></div>
          <div class="stats-grid"><article class="card stat-card"><div class="stat-top"><span>Modules</span><span class="stat-icon">▦</span></div><strong>05</strong><small>Data science curriculum</small></article><article class="card stat-card"><div class="stat-top"><span>Lab projects</span><span class="stat-icon">⌘</span></div><strong>${state.projects.length}</strong><small>GitHub-linked projects</small></article><article class="card stat-card"><div class="stat-top"><span>Study tools</span><span class="stat-icon">⚒</span></div><strong>06</strong><small>Ready to explore</small></article><article class="card stat-card"><div class="stat-top"><span>Resources</span><span class="stat-icon">▤</span></div><strong>04</strong><small>Curated references</small></article></div>
          <div class="section-title"><h2>Your learning space</h2><button class="text-button" data-goto="modules">View all modules →</button></div>
          <div class="dashboard-grid"><div class="module-list">${modules.slice(0,3).map((module,index)=>`<article class="card module-row"><div class="module-number">0${index+1}</div><div class="module-info"><strong>${escapeHtml(module.title)}</strong><span>${escapeHtml(module.tag)}</span></div><span class="module-tag">Not started</span></article>`).join("")}</div>
          <article class="card student-id-card"><div class="id-card-top"><img class="id-card-logo" src="mbu-logo.png" alt="Mohan Babu University logo"></div><div class="id-card-photo">${state.photo?`<img src="${escapeHtml(state.photo)}" alt="Student photograph">`:`<div class="id-card-photo-placeholder">${escapeHtml(initials(state.name))}</div>`}</div><div class="id-card-validity">Valid until 2028-06-30</div><h3 class="id-card-name">${escapeHtml(state.name)}</h3><div class="id-card-details"><div><span>Registration No.</span><strong>${escapeHtml(state.register)}</strong></div><div><span>Course</span><strong>${escapeHtml(state.course)}</strong></div><div><span>Year of Admission</span><strong>${escapeHtml(state.admissionYear)}</strong></div></div><div class="id-card-signature">Registrar</div><div class="id-card-footer">DREAM&nbsp; · &nbsp; BELIEVE&nbsp; · &nbsp; ACHIEVE</div><button class="primary-button" data-goto="profile">Edit student details</button></article></div>`;
      }else if(page==="modules"){
        pageContent.innerHTML=`<div class="page-heading"><div><span class="eyebrow">Curriculum</span><h1>Data science modules</h1><p>Five core modules to guide your learning, from foundations to machine learning.</p></div></div><div class="cards-grid">${moduleCards()}</div>`;
      }else if(page==="module-1"||page==="module-2"){
        activeModuleNumber=Number(page.slice(-1));
        const deckList=getActiveDecks();
        const moduleTitle=modules[activeModuleNumber-1].title;
        pageContent.innerHTML=`<div class="page-heading"><div><span class="eyebrow">Module ${activeModuleNumber} · ${escapeHtml(modules[activeModuleNumber-1].tag)}</span><h1>${escapeHtml(moduleTitle)}</h1><p>Choose a presentation to read as an open, page-turning notebook.</p></div><button class="text-button" data-goto="modules">← Back to modules</button></div><div class="flipbook-decks">${deckList.map((deck,index)=>`<article class="card flipbook-deck"><div class="flipbook-icon" aria-hidden="true">▤</div><h2>${escapeHtml(deck.title)}</h2><p>${deck.slides} pages</p><button class="primary-button" data-deck-index="${index}">Open notebook</button>${deck.sourceDoc?`<div class="flipbook-source-links"><a class="text-button" href="modules/module-${activeModuleNumber}/${escapeHtml(deck.sourcePdf)}" target="_blank" rel="noopener noreferrer">Open PDF</a><a class="text-button" href="modules/module-${activeModuleNumber}/${escapeHtml(deck.sourceDoc)}" download>Download DOCX</a></div>`:""}</article>`).join("")}</div><section class="card flipbook-viewer" id="flipbookViewer" hidden><div class="flipbook-toolbar"><strong id="flipbookTitle"></strong><button class="text-button" data-close-flipbook>Choose another presentation</button></div><div class="flipbook-stage"><button class="flipbook-arrow" id="previousSlide" data-flip="-1" aria-label="Previous spread">‹</button><div class="notebook-spread" id="notebookSpread"><div class="notebook-leaf"><img id="leftNotebookPage" alt=""><span class="notebook-page-number"><span class="notebook-page-label">DATA SCIENCE · MODULE ${activeModuleNumber}</span><span id="leftPageNumber"></span></span></div><div class="notebook-leaf" id="rightNotebookLeaf"><img id="rightNotebookPage" alt=""><span class="notebook-page-number"><span class="notebook-page-label">DATA SCIENCE · MODULE ${activeModuleNumber}</span><span id="rightPageNumber"></span></span></div></div><button class="flipbook-arrow" id="nextSlide" data-flip="1" aria-label="Next spread">›</button></div><div class="flipbook-controls"><button class="primary-button" id="previousSlideButton" data-flip="-1">← Previous spread</button><span class="flipbook-count" id="flipbookCount" aria-live="polite"></span><button class="primary-button" id="nextSlideButton" data-flip="1">Next spread →</button></div></section>`;
      }else if(page==="labs"){
        pageContent.innerHTML=`<div class="page-heading"><div><span class="eyebrow">Build and share</span><h1>Lab assignments</h1><p>Add your lab projects and link each one to its GitHub repository.</p></div></div>
          <form class="card form-card" id="projectForm"><div class="form-grid"><div class="field"><label for="projectName">Project name</label><input id="projectName" name="projectName" placeholder="e.g. Student performance analysis" required></div><div class="field"><label for="projectModule">Related module</label><select id="projectModule" name="projectModule">${modules.map((module,index)=>`<option value="${escapeHtml(module.title)}">Module ${index+1} · ${escapeHtml(module.title)}</option>`).join("")}</select></div><div class="field" style="grid-column:1/-1"><label for="projectUrl">GitHub repository URL</label><input id="projectUrl" name="projectUrl" type="url" placeholder="https://github.com/username/repository" pattern="https?://(www\\.)?github\\.com/[^\\s]+" required></div></div><button class="primary-button" type="submit">＋ Add lab project</button></form>
          <div class="section-title"><h2>Your projects</h2><span class="muted" style="font-size:11px">${state.projects.length} added</span></div><div class="project-list">${state.projects.length?state.projects.map((project)=>`<article class="card project-row"><div><h3>${escapeHtml(project.name)}</h3><p>${escapeHtml(project.module)}</p></div><a href="${escapeHtml(project.url)}" target="_blank" rel="noopener noreferrer">Open on GitHub ↗</a></article>`).join(""):`<div class="card empty-state">Your lab projects will appear here. Add a project above to get started.</div>`}</div>`;
        document.getElementById("projectForm").addEventListener("submit",(event)=>{
          event.preventDefault();const form=new FormData(event.currentTarget);const field=document.getElementById("projectUrl");const url=String(form.get("projectUrl")).trim();let parsed;
          try{parsed=new URL(url)}catch{field.setCustomValidity("Enter a valid GitHub repository URL.");field.reportValidity();return}
          if(!["github.com","www.github.com"].includes(parsed.hostname.toLowerCase())||parsed.pathname.split("/").filter(Boolean).length<2){field.setCustomValidity("Enter a GitHub URL with an owner and repository name.");field.reportValidity();return}
          state.projects.push({name:String(form.get("projectName")).trim(),module:String(form.get("projectModule")),url:parsed.href});setPage("labs");
        });
        document.getElementById("projectUrl").addEventListener("input",(event)=>event.currentTarget.setCustomValidity(""));
      }else if(page==="tools"){
        pageContent.innerHTML=`<div class="page-heading"><div><span class="eyebrow">Your toolkit</span><h1>Data science tools</h1><p>Handy platforms and libraries for learning, analysis, and building projects.</p></div></div><div class="cards-grid">${tools.map((tool)=>`<article class="card content-card"><div class="tool-icon">${tool.icon}</div><h3>${escapeHtml(tool.title)}</h3><p>${escapeHtml(tool.description)}</p><a class="text-button" href="${escapeHtml(tool.url)}" target="_blank" rel="noopener noreferrer">Explore tool ↗</a></article>`).join("")}</div>`;
      }else if(page==="resources"){
        pageContent.innerHTML=`<div class="page-heading"><div><span class="eyebrow">Keep exploring</span><h1>Learning resources</h1><p>Trusted guides and references to support your data science journey.</p></div></div><div class="resource-list">${resources.map((resource)=>`<article class="card resource-row"><div class="tool-icon">${resource.icon}</div><div><strong>${escapeHtml(resource.title)}</strong><span>${escapeHtml(resource.type)}</span></div><a href="${escapeHtml(resource.url)}" target="_blank" rel="noopener noreferrer">Open ↗</a></article>`).join("")}</div>`;
      }else if(page==="ai"){
        pageContent.innerHTML=`<div class="page-heading"><div><span class="eyebrow">Ask, learn, practice</span><h1>AI study assistant</h1><p>Try a sample prompt to get a quick study tip.</p></div></div><section class="card chat-card"><div class="chat-head"><strong>✳ Data science study assistant</strong><span>Learning demo · sample replies, not connected to an AI service</span></div><div class="chat-messages" id="chatMessages"><div class="chat-message">Hi ${escapeHtml(state.name)}! Ask me a data science question. This demo can help with a few introductory topics.</div></div><form class="chat-form" id="chatForm"><input id="chatInput" placeholder="Try: What is data cleaning?" aria-label="Ask a study question" required><button class="primary-button" type="submit">Ask</button></form><div class="chat-note">This sample assistant uses preset answers. Connect an AI service to enable real model responses.</div></section>`;
        document.getElementById("chatForm").addEventListener("submit",(event)=>{
          event.preventDefault();const input=document.getElementById("chatInput");const question=input.value.trim();if(!question)return;const messages=document.getElementById("chatMessages");
          const userMessage=document.createElement("div");userMessage.className="chat-message user";userMessage.textContent=question;messages.append(userMessage);
          const answer=document.createElement("div");answer.className="chat-message";
          answer.textContent=/clean|prepar/i.test(question)?"Data cleaning is the process of fixing or removing inaccurate, incomplete, duplicate, or inconsistent data. A typical workflow is to inspect missing values, correct data types, remove duplicates, and validate the result.":/machine learning|model/i.test(question)?"Machine learning uses data to train a model to identify patterns and make predictions. Start by defining the problem, splitting data into training and test sets, fitting a model, and evaluating it on data it has not seen.":"Start by breaking the topic into a question you can answer with data. Explore your dataset, check its quality, summarize important variables, and explain what you find. This demo has sample answers for data cleaning and machine learning.";
          messages.append(answer);input.value="";messages.scrollTop=messages.scrollHeight;
        });
      }else if(page==="profile"){
        pageContent.innerHTML=`<div class="page-heading"><div><span class="eyebrow">Your details</span><h1>Student profile</h1><p>Update the details shown on your student ID card.</p></div></div><form class="card form-card" id="profileForm"><div class="form-grid"><div class="field"><label for="profileName">Full name</label><input id="profileName" name="name" value="${escapeHtml(state.name)}" required></div><div class="field"><label for="profileRegister">Registration number</label><input id="profileRegister" name="register" value="${escapeHtml(state.register)}" required></div><div class="field"><label for="profileCourse">Course</label><input id="profileCourse" name="course" value="${escapeHtml(state.course)}" required></div><div class="field"><label for="profileAdmissionYear">Year of admission</label><input id="profileAdmissionYear" name="admissionYear" value="${escapeHtml(state.admissionYear)}" required></div></div><button class="primary-button" type="submit">Save student details</button></form>`;
        document.getElementById("profileForm").addEventListener("submit",(event)=>{event.preventDefault();const form=new FormData(event.currentTarget);["name","register","course","admissionYear"].forEach((key)=>{state[key]=String(form.get(key)||"").trim()});document.getElementById("welcomeMini").textContent=`Welcome, ${state.name}`;document.getElementById("avatarButton").textContent=initials(state.name);setPage("profile")});
      }
    }
    document.querySelectorAll(".nav-button").forEach((button)=>button.addEventListener("click",()=>setPage(button.dataset.page)));
    pageContent.addEventListener("click",(event)=>{
      const target=event.target.closest("[data-goto],[data-deck-index],[data-flip],[data-close-flipbook]");
      if(!target)return;
      if(target.hasAttribute("data-goto"))setPage(target.dataset.goto);
      else if(target.hasAttribute("data-deck-index"))openFlipbook(Number(target.dataset.deckIndex));
      else if(target.hasAttribute("data-flip"))turnFlipbookPage(Number(target.dataset.flip));
      else document.getElementById("flipbookViewer").hidden=true;
    });
    document.getElementById("avatarButton").addEventListener("click",()=>setPage("profile"));
    document.getElementById("menuButton").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));
    document.getElementById("welcomeMini").textContent=`Welcome, ${state.name}`;
    document.getElementById("avatarButton").textContent=initials(state.name);
    setPage("home");
  </script>
</body>
</html>
