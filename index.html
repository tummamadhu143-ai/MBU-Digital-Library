    .student-id-card{position:relative;align-self:start;overflow:hidden;padding:0;border:1px solid #dedede;border-radius:14px;background:#fff;box-shadow:0 12px 30px rgba(36,38,73,.12)}

    .notebook-spread{position:relative;display:grid;width:min(100%,1120px);grid-template-columns:1fr 1fr;overflow:hidden;border:1px solid #dcd8cf;border-radius:7px;background:#eeeae2;box-shadow:0 16px 38px rgba(36,38,73,.17);perspective:1600px}

    function openLabFileDatabase(){
      return new Promise((resolve,reject)=>{
        if(!window.indexedDB){reject(new Error("Browser file storage is unavailable."));return}
        const request=indexedDB.open(labFileDatabaseName,1);
        request.onupgradeneeded=()=>request.result.createObjectStore("labFiles",{keyPath:"id",autoIncrement:true});
        request.onsuccess=()=>resolve(request.result);
        request.onerror=()=>reject(request.error||new Error("Could not open browser file storage."));
      });
    }
    async function getLabFiles(){
      const database=await openLabFileDatabase();
      return new Promise((resolve,reject)=>{
        const transaction=database.transaction("labFiles","readonly");
        const request=transaction.objectStore("labFiles").getAll();
        request.onsuccess=()=>resolve(request.result);
        request.onerror=()=>reject(request.error||new Error("Could not read saved lab files."));
        transaction.oncomplete=()=>database.close();
        transaction.onerror=()=>{database.close();reject(transaction.error||new Error("Could not read saved lab files."))};
      });
    }

    function createPythonWorker(){

      await runtime.runPythonAsync("import matplotlib\\nmatplotlib.use('Agg')");
    }

    if(result&&typeof result.destroy==="function")result.destroy();
    if(data.code.includes("matplotlib")){
      const image=runtime.FS.readFile("/tmp/experiment-plot.png");
      let binary="";
      for(const byte of image)binary+=String.fromCharCode(byte);
      self.postMessage({type:"plot",data:btoa(binary)});
      runtime.FS.unlink("/tmp/experiment-plot.png");
    }
    self.postMessage({type:"done",value});
  }catch(error){
    self.postMessage({type:"error",message:error&&error.message?error.message:String(error)});
  }
};`;
      const sourceUrl=URL.createObjectURL(new Blob([source],{type:"text/javascript"}));

      const selector=document.getElementById("pythonExperiment");

          sourceLink.href=`projects/experiments/${escapeHtml(experiment.file)}`;
          sourceLink.download=experiment.file;
        }
        editor.value=selectedCode();
        clearPlot();
        setOutput("Select Run Python to execute this example.");
      };
      const finishRun=()=>{
        window.clearTimeout(pythonRunTimer);
        pythonRunTimer=null;
        runButton.disabled=false;
      };
      selector.addEventListener("change",updateSelection);
      sectionSelector.addEventListener("change",()=>{editor.value=selectedCode();clearPlot();setOutput("Select Run Python to execute this section.");});
      resetButton.addEventListener("click",()=>{editor.value=selectedCode();});
      updateSelection();
      runButton.addEventListener("click",()=>{
        if(pythonRunTimer!==null)window.clearTimeout(pythonRunTimer);
        runButton.disabled=true;
        clearPlot();
        setOutput("");
        status.textContent="Starting Python runtime…";
        try{
          if(!pythonWorker){
            pythonWorker=createPythonWorker();
            pythonWorker.addEventListener("message",(event)=>{
              const message=event.data;
              if(message.type==="status")status.textContent=message.text;
              else if(message.type==="ready"){
                status.textContent="Running code…";
                window.clearTimeout(pythonRunTimer);
                pythonRunTimer=window.setTimeout(()=>{
                  pythonWorker.terminate();
                  pythonWorker=null;
                  finishRun();
                  status.textContent="Execution stopped after 20 seconds.";
                  setOutput("The program took too long and was stopped. Try a smaller example.",true);
                },20000);
              }else if(message.type==="stdout"||message.type==="stderr"){
                output.textContent+=message.text;
                output.scrollTop=output.scrollHeight;
                if(message.type==="stderr")output.classList.add("error");
              }else if(message.type==="plot"){
                plot.src=`data:image/png;base64,${message.data}`;
                plot.hidden=false;
              }else if(message.type==="done"){
                if(message.value)output.textContent+=`${output.textContent?"\\n":""}${message.value}`;
                if(!output.textContent)output.textContent="Code finished without printed output.";
                status.textContent="Run complete.";
                finishRun();
              }else if(message.type==="error"){
                setOutput(`${output.textContent}${output.textContent?"\\n":""}${message.message}`,true);
                status.textContent="Execution failed.";
                finishRun();
              }
            });
            pythonWorker.addEventListener("error",(event)=>{
              pythonWorker.terminate();
              pythonWorker=null;
              finishRun();
              status.textContent="Python runtime could not be loaded.";
              setOutput(event.message||"Could not load the Python runtime. Check your internet connection and try again.",true);
            },{once:true});
          }
          pythonRunTimer=window.setTimeout(()=>{
            if(pythonWorker){pythonWorker.terminate();pythonWorker=null}
            finishRun();
            status.textContent="Python runtime loading timed out.";
            setOutput("The runtime did not load in time. Check your internet connection and retry.",true);
          },120000);
          pythonWorker.postMessage({type:"run",code:editor.value});
        }catch(error){
          finishRun();
          status.textContent="Python runtime could not be started.";
          setOutput(error.message,true);
        }
      });
    }

        pageContent.innerHTML=`<div class="page-heading"><div><span class="eyebrow">Interactive learning</span><h1>Projects</h1><p>Explore ten experiments, choose an A/B/C section, and run its Python code in your browser.</p></div></div><section class="profile-section"><h2>Data Science experiments</h2><div class="cards-grid">${window.courseExperiments.map((experiment,index)=>`<article class="card experiment-reference"><h3>Experiment ${index+1}: ${escapeHtml(experiment.title)}</h3><ol>${experiment.sections.map((section,sectionIndex)=>`<li>${String.fromCharCode(65+sectionIndex)}. ${escapeHtml(section.title)}</li>`).join("")}</ol><a class="text-button" href="projects/experiments/${escapeHtml(experiment.file)}" download="${escapeHtml(experiment.file)}">Download Experiment ${index+1} document</a></article>`).join("")}</div></section><section class="card compiler-card"><div class="compiler-toolbar"><div class="field"><label for="pythonExperiment">Choose experiment or example</label><select id="pythonExperiment"><optgroup label="Data Science experiments">${window.courseExperiments.map((experiment,index)=>`<option value="course-${index}" data-course-index="${index}">Experiment ${index+1} · ${escapeHtml(experiment.title)}</option>`).join("")}</optgroup><optgroup label="Quick examples">${pythonExperiments.map((experiment,index)=>`<option value="sample-${index}" data-sample-index="${index}">${escapeHtml(experiment.title)}</option>`).join("")}</optgroup></select></div><div class="field"><label for="pythonSection">Experiment section</label><select id="pythonSection"></select></div><div class="compiler-actions"><span class="compiler-status" id="pythonStatus" aria-live="polite">First run loads Python and data-science packages (internet required).</span><button class="primary-button" id="runPythonButton" type="button">▶ Run Python</button></div></div><label class="eyebrow" for="pythonEditor">Python code</label><textarea class="compiler-editor" id="pythonEditor" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Python code editor">${escapeHtml(window.courseExperiments[0].sections[0].code)}</textarea><div class="compiler-actions" style="justify-content:flex-end;margin-top:12px"><a class="text-button" id="experimentSource" href="projects/experiments/Experiment-1.docx" download="Experiment-1.docx">Download source document</a><button class="text-button" id="resetPythonButton" type="button">Reset section</button></div><pre class="compiler-output" id="pythonOutput" aria-label="Python output" aria-live="polite">Select Run Python to execute this section.</pre><img class="compiler-plot" id="pythonPlot" alt="Python-generated experiment chart" hidden><p class="compiler-note">Python runs in your browser using Pyodide. The first run downloads the runtime and required packages; an internet connection is needed. Experiment programs use sample data. The review example parses sample HTML only and does not access Amazon or other websites.</p></section>`;
        bindPythonCompiler();
      }else if(page==="assignments"){
        pageContent.innerHTML=`<div class="page-heading"><div><span class="eyebrow">Coursework</span><h1>Assignments</h1><p>Open or download assignment PDFs for your data science modules.</p></div></div><div class="flipbook-decks">${assignments.map((assignment,index)=>`<article class="card flipbook-deck"><div class="flipbook-icon" aria-hidden="true">▤</div><h2>${escapeHtml(assignment.title)}</h2><p>${assignment.slides} pages · PDF</p><button class="primary-button" data-assignment-index="${index}">Open notebook</button><div class="flipbook-source-links"><a class="text-button" href="assignments/${escapeHtml(assignment.file)}" download>Download PDF</a></div></article>`).join("")}</div><section class="card flipbook-viewer" id="flipbookViewer" hidden><div class="flipbook-toolbar"><strong id="flipbookTitle"></strong><button class="text-button" data-close-flipbook>Choose another assignment</button></div><div class="flipbook-stage"><button class="flipbook-arrow" id="previousSlide" data-flip="-1" aria-label="Previous spread">‹</button><div class="notebook-spread" id="notebookSpread"><div class="notebook-leaf"><img id="leftNotebookPage" alt=""><span class="notebook-page-number"><span class="notebook-page-label">DATA SCIENCE · ASSIGNMENT</span><span id="leftPageNumber"></span></span></div><div class="notebook-leaf" id="rightNotebookLeaf"><img id="rightNotebookPage" alt=""><span class="notebook-page-number"><span class="notebook-page-label">DATA SCIENCE · ASSIGNMENT</span><span id="rightPageNumber"></span></span></div></div><button class="flipbook-arrow" id="nextSlide" data-flip="1" aria-label="Next spread">›</button></div><div class="flipbook-controls"><button class="primary-button" id="previousSlideButton" data-flip="-1">← Previous spread</button><span class="flipbook-count" id="flipbookCount" aria-live="polite"></span><button class="primary-button" id="nextSlideButton" data-flip="1">Next spread →</button></div></section>`;
      }else if(page==="quizzes"){
        pageContent.innerHTML=`<div class="page-heading"><div><span class="eyebrow">Coursework</span><h1>Quizzes &amp; Tests</h1><p>Review quizzes and tests for your data science modules.</p></div></div><section class="card empty-state"><strong>No quizzes or tests yet</strong><p>Quizzes and tests will appear here when they are added to the library.</p><button class="primary-button" data-goto="modules">Browse modules</button></section>`;
      }else if(page==="tools"){
        pageContent.innerHTML=`<div class="page-heading"><div><span class="eyebrow">MBU · DATA SCIENCE</span><h1>Data Science Tools</h1><p>A practical guide to popular tools for collecting, analyzing, visualizing and sharing data.</p></div></div><section class="card tool-guide"><h2>Getting started</h2><p>Start with Python, Jupyter or Colab, NumPy, Pandas and Matplotlib. Add SQL for database work, then explore machine learning or dashboard tools as your projects need them.</p></section><div class="cards-grid">${tools.map((tool)=>`<article class="card content-card tool-card"><span class="card-kicker">${escapeHtml(tool.category)}</span><div class="tool-icon" aria-hidden="true">${tool.icon}</div><h3>${escapeHtml(tool.title)}</h3><p>${escapeHtml(tool.description)}</p><a class="text-button" href="${escapeHtml(tool.url)}" target="_blank" rel="noopener noreferrer">External tool ↗</a></article>`).join("")}</div>`;
      }else if(page==="resources"||page==="references"){
        pageContent.innerHTML=`<div class="page-heading"><div><span class="eyebrow">Keep exploring</span><h1>References</h1><p>Trusted guides and references to support your data science journey.</p></div></div><div class="resource-list">${resources.map((resource)=>`<article class="card resource-row"><div class="tool-icon">${resource.icon}</div><div><strong>${escapeHtml(resource.title)}</strong><span>${escapeHtml(resource.type)}</span></div><a href="${escapeHtml(resource.url)}" target="_blank" rel="noopener noreferrer">Open ↗</a></article>`).join("")}</div>`;
      }else if(page==="ai"){
        pageContent.innerHTML=`<div class="page-heading"><div><span class="eyebrow">Ask, learn, practice</span><h1>AI study assistant</h1><p>Ask questions and get responses from the OpenAI-powered assistant.</p></div></div><section class="card chat-card"><div class="chat-head"><strong>✳ Data science study assistant</strong><span>AI-powered answers · avoid sharing private or sensitive information</span></div><div class="chat-messages" id="chatMessages" aria-live="polite"><div class="chat-message">Hi ${escapeHtml(state.name)}! Ask me a question about data science or any other topic.</div></div><form class="chat-form" id="chatForm"><input id="chatInput" maxlength="4000" placeholder="Ask anything..." aria-label="Ask a question" autocomplete="off" required><button class="primary-button" id="chatSubmit" type="submit">Ask</button></form><div class="chat-note" id="chatStatus">The secure AI backend must be deployed and configured to answer questions.</div></section>`;
        document.getElementById("chatForm").addEventListener("submit",(event)=>{
          event.preventDefault();
          const input=document.getElementById("chatInput");
          const submit=document.getElementById("chatSubmit");
          const status=document.getElementById("chatStatus");
          const messages=document.getElementById("chatMessages");
          const question=input.value.trim();
          if(!question)return;
          const endpoint=document.querySelector('meta[name="ai-api-url"]').content.trim()||
            (location.protocol==="file:"||location.hostname.endsWith(".github.io")?"":"/api/chat");
          const appendMessage=(text,className="chat-message")=>{
            const message=document.createElement("div");
            message.className=className;
            message.textContent=text;
            messages.append(message);
            messages.scrollTop=messages.scrollHeight;
            return message;
          };
          appendMessage(question,"chat-message user");
          input.value="";
          input.disabled=true;
          submit.disabled=true;
          status.textContent="Waiting for the AI assistant…";
          const pending=appendMessage("Thinking…","chat-message pending");
          const conversation=[...messages.querySelectorAll(".chat-message:not(.pending)")].slice(-12)
            .filter((message)=>!message.classList.contains("error"))
            .map((message)=>({role:message.classList.contains("user")?"user":"assistant",content:message.textContent}));
          while(conversation.length>1&&conversation.reduce((total,message)=>total+message.content.length,0)>12000){
            conversation.shift();
          }
          if(!endpoint){
            pending.remove();
            const error=appendMessage("The AI backend is not configured for this GitHub Pages site yet. Deploy the Vercel backend, then set the ai-api-url meta tag in index.html to its /api/chat URL.","chat-message error");
            error.setAttribute("role","alert");
            status.textContent="Backend configuration required.";
            input.disabled=false;
            submit.disabled=false;
            input.focus();
            return;
          }
          fetch(endpoint,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({messages:conversation})
          }).then(async(response)=>{
            let result;
            try{result=await response.json()}catch{throw new Error("The AI backend returned an invalid response.")}
            if(!response.ok)throw new Error(result.error||"The AI assistant could not answer. Please try again.");
            if(typeof result.reply!=="string"||!result.reply.trim())throw new Error("The AI assistant returned an empty answer. Please try again.");
            pending.textContent=result.reply.trim();
            pending.classList.remove("pending");
            status.textContent="Answer generated by the AI assistant.";
          }).catch((error)=>{
            pending.remove();
            const message=appendMessage(error.message||"Could not connect to the AI assistant. Please try again.","chat-message error");
            message.setAttribute("role","alert");
            status.textContent="The AI request failed.";
          }).finally(()=>{
            input.disabled=false;
            submit.disabled=false;
            input.focus();
          });
        });
      }else if(page==="profile"){
        pageContent.innerHTML=`<div class="page-heading"><div><span class="eyebrow">Student records</span><h1>Academic Profile</h1><p>Academic and personal information for ${escapeHtml(state.name)}.</p></div></div><div class="profile-sections">${academicProfileSections.map((section)=>`<section class="card profile-section"><h2>${section.title}</h2><dl class="profile-details">${section.details.map(([label,value])=>`<div class="profile-detail"><dt>${escapeHtml(label)}</dt><dd>${label==="Student status"?value:escapeHtml(value)}</dd></div>`).join("")}</dl></section>`).join("")}</div>`;
      }
    }
    document.querySelectorAll(".nav-button").forEach((button)=>button.addEventListener("click",()=>setPage(button.dataset.page)));
    pageContent.addEventListener("click",async(event)=>{
      const fileAction=event.target.closest("[data-download-lab-file],[data-delete-lab-file]");
      if(fileAction){
        const status=document.getElementById("labFileStatus");
        try{
          const id=Number(fileAction.dataset.downloadLabFile||fileAction.dataset.deleteLabFile);
          if(fileAction.hasAttribute("data-download-lab-file")){
            const file=await getLabFile(id);
            if(!file)throw new Error("The selected file is no longer available.");
            const url=URL.createObjectURL(file.blob);
            const link=document.createElement("a");
            link.href=url;
            link.download=file.name;
            link.click();
            setTimeout(()=>URL.revokeObjectURL(url),1000);
          }else{
            await deleteLabFile(id);
            await refreshLabFileList();
            if(status)status.textContent="File removed from this browser.";
          }
        }catch(error){
          if(status)status.textContent=`Could not complete the file action: ${error.message}`;
        }
        return;
      }
      const target=event.target.closest("[data-goto],[data-deck-index],[data-assignment-index],[data-flip],[data-close-flipbook]");
      if(!target)return;
      if(target.hasAttribute("data-goto"))setPage(target.dataset.goto);
      else if(target.hasAttribute("data-deck-index"))openFlipbook(Number(target.dataset.deckIndex));
      else if(target.hasAttribute("data-assignment-index"))openAssignment(Number(target.dataset.assignmentIndex));
      else if(target.hasAttribute("data-flip"))turnFlipbookPage(Number(target.dataset.flip));
      else document.getElementById("flipbookViewer").hidden=true;
    });
    document.getElementById("avatarButton").addEventListener("click",()=>setPage("profile"));
    document.getElementById("menuButton").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));
    document.getElementById("welcomeMini").textContent=`Welcome, ${state.name}`;
    renderProfileAvatar();
    setPage("home");
  </script>
</body>
</html>
