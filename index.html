  <style>

    .student-id-card{position:relative;align-self:start;overflow:hidden;padding:0;border:1px solid #dedede;border-radius:14px;background:#fff;box-shadow:0 12px 30px rgba(36,38,73,.12)}
    .id-card-top{display:flex;min-height:80px;align-items:center;justify-content:center;overflow:hidden;padding:8px 14px;background:#fff}
    .id-card-logo{display:block;width:min(100%,190px);height:auto;max-height:68px;object-fit:contain;object-position:center}
    .id-card-top strong,.id-card-top span{position:relative;z-index:1;display:block}
    .id-card-top strong{font-size:15px;letter-spacing:.06em}
    .id-card-top span{margin-top:3px;font-size:8px;font-weight:750;letter-spacing:.1em}
    .id-card-photo{position:relative;width:126px;height:132px;margin:16px auto 10px;overflow:hidden;background:linear-gradient(145deg,#e9e7ed,#f7f6f8)}
    .id-card-photo img{width:100%;height:100%;object-fit:cover}
    .id-card-photo-placeholder{display:grid;width:100%;height:100%;place-items:center;color:#5547c8;background:linear-gradient(145deg,#e8e5f1,#f7f6f8);font-size:30px;font-weight:800}
    .id-card-validity{position:absolute;top:111px;right:7px;color:#444;font-size:8px;font-weight:700;writing-mode:vertical-rl;transform:rotate(180deg)}
    .id-card-name{margin:0 12px 14px;color:#a64449;text-align:center;font-size:12px;letter-spacing:.035em}
    .id-card-details{display:grid;gap:9px;padding:0 15px 12px}
    .id-card-details div{display:grid;grid-template-columns:106px minmax(0,1fr);gap:6px;font-size:10px}
    .id-card-details span{color:#555}
    .id-card-details strong{overflow-wrap:anywhere;color:#252525}
    .id-card-signature{min-height:38px;padding:7px 15px;color:#555;text-align:right;font-size:10px}
    .id-card-footer{padding:9px 10px;color:#fff;background:#b43c43;text-align:center;font-size:8px;font-weight:800;letter-spacing:.16em}
    .student-id-card>.primary-button{width:calc(100% - 30px);margin:13px 15px}
    .module-card{display:flex;flex-direction:column;align-items:flex-start}
    .module-open{margin-top:auto}
    .flipbook-decks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
    .flipbook-deck{padding:20px}
    .flipbook-deck h2{margin:10px 0 6px;font-size:15px}
    .flipbook-deck p{margin:0 0 16px;color:var(--muted);font-size:12px}
    .flipbook-deck .primary-button{width:100%}
    .flipbook-source-links{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
    .flipbook-source-links a{font-size:11px}
    .flipbook-icon{display:grid;width:42px;height:42px;place-items:center;border-radius:12px;color:var(--primary);background:var(--purple-soft);font-size:20px}
    .flipbook-viewer{margin-top:22px;padding:18px}
    .flipbook-viewer[hidden]{display:none}
    .flipbook-toolbar,.flipbook-controls{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .flipbook-toolbar{padding-bottom:14px;border-bottom:1px solid var(--line);font-size:12px}
    .flipbook-toolbar span,.flipbook-count{color:var(--muted);font-size:11px}
    .flipbook-stage{display:flex;align-items:center;justify-content:center;gap:12px;padding:22px 0}
    .notebook-spread{position:relative;display:grid;width:min(100%,1120px);grid-template-columns:1fr 1fr;overflow:hidden;border:1px solid #dcd8cf;border-radius:7px;background:#eeeae2;box-shadow:0 16px 38px rgba(36,38,73,.17);perspective:1600px}
    .notebook-spread:after{position:absolute;z-index:2;top:0;bottom:0;left:50%;width:22px;transform:translateX(-50%);background:linear-gradient(90deg,rgba(42,35,23,.08),rgba(255,255,255,.35) 45%,rgba(42,35,23,.12));content:"";pointer-events:none}
    .notebook-spread.single-page{width:min(100%,760px);grid-template-columns:minmax(0,1fr)}
    .notebook-spread.single-page:after{display:none}
    .notebook-spread.single-page .notebook-leaf:first-child{padding-right:14px;border-right:0}
    .notebook-spread.single-page .notebook-leaf:last-child{display:none}
    .notebook-spread.single-page .notebook-turn-page{right:0;left:0;width:100%}
    .notebook-leaf{position:relative;display:flex;min-width:0;min-height:220px;flex-direction:column;padding:14px 14px 10px;background:repeating-linear-gradient(180deg,#fffefa 0,#fffefa 31px,#e9edf4 32px);transform-origin:center}
    .notebook-leaf:first-child{padding-right:20px;border-right:1px solid #e2ded5}
    .notebook-leaf:last-child{padding-left:20px}
    .notebook-leaf img{display:block;width:100%;height:auto;aspect-ratio:16/9;align-self:center;object-fit:contain;border:1px solid #e8e5df;background:#fff}
    .notebook-leaf img.assignment-page{aspect-ratio:3/4}
    .notebook-leaf.is-empty{justify-content:center;align-items:center;color:#a4a0aa;font-size:12px}
    .notebook-leaf.is-empty img{display:none}
    .notebook-page-number{display:flex;justify-content:space-between;margin-top:auto;padding:9px 3px 0;color:#8e8b85;font-size:10px}
    .notebook-turn-page{position:absolute;z-index:3;top:0;bottom:0;width:50%;transform-style:preserve-3d;animation-duration:.72s;animation-timing-function:ease-in-out;animation-fill-mode:forwards}
    .notebook-turn-page.forward{right:0;transform-origin:left center;animation-name:turnPageForward}
    .notebook-turn-page.backward{left:0;transform-origin:right center;animation-name:turnPageBackward}
    .notebook-spread.single-page .notebook-turn-page.forward{transform-origin:left center}
    .notebook-spread.single-page .notebook-turn-page.backward{transform-origin:right center}
    .notebook-page-face{position:absolute;inset:0;overflow:hidden;padding:14px 14px 10px;background:repeating-linear-gradient(180deg,#fffefa 0,#fffefa 31px,#e9edf4 32px);backface-visibility:hidden}
    .notebook-page-face.front{box-shadow:inset 1px 0 rgba(58,47,30,.12)}
    .notebook-page-face.back{transform:rotateY(180deg);box-shadow:inset -1px 0 rgba(58,47,30,.12)}
    .notebook-turn-page.backward .notebook-page-face.back{transform:rotateY(-180deg)}
    .notebook-page-face img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;border:1px solid #e8e5df;background:#fff}
    .notebook-page-face img.assignment-page{aspect-ratio:3/4}
    @keyframes turnPageForward{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}

    self.postMessage({type:"ready"});
    const result=await runtime.runPythonAsync(data.code);
    const value=result===undefined||result===null?"":String(result);

};`;

        output.textContent=text;
        output.classList.toggle("error",isError);
      };
      const finishRun=()=>{
        window.clearTimeout(pythonRunTimer);
        pythonRunTimer=null;
        runButton.disabled=false;
      };
      selector.addEventListener("change",()=>{editor.value=pythonExperiments[Number(selector.value)].code;setOutput("Select Run Python to execute this example.");});
      resetButton.addEventListener("click",()=>{editor.value=pythonExperiments[Number(selector.value)].code;});
      runButton.addEventListener("click",()=>{
        if(pythonRunTimer!==null)window.clearTimeout(pythonRunTimer);
        runButton.disabled=true;
        setOutput("");
        status.textContent="Starting Python runtime…";
        try{
          if(!pythonWorker){
            pythonWorker=createPythonWorker();
            pythonWorker.addEventListener("message",(event)=>{
              const message=event.data;
              if(message.type==="status")status.textContent=message.text;
              else if(message.type==="ready"){
                status.textContent="Running code…";
                window.clearTimeout(pythonRunTimer);
                pythonRunTimer=window.setTimeout(()=>{
                  pythonWorker.terminate();
                  pythonWorker=null;
                  finishRun();
                  status.textContent="Execution stopped after 20 seconds.";
                  setOutput("The program took too long and was stopped. Try a smaller example.",true);
                },20000);
              }else if(message.type==="stdout"||message.type==="stderr"){
                output.textContent+=message.text;
                output.scrollTop=output.scrollHeight;
                if(message.type==="stderr")output.classList.add("error");
              }else if(message.type==="done"){
                if(message.value)output.textContent+=`${output.textContent?"\\n":""}${message.value}`;
                if(!output.textContent)output.textContent="Code finished without printed output.";
                status.textContent="Run complete.";
                finishRun();
              }else if(message.type==="error"){
                setOutput(`${output.textContent}${output.textContent?"\\n":""}${message.message}`,true);
                status.textContent="Execution failed.";
                finishRun();
              }
            });
            pythonWorker.addEventListener("error",(event)=>{
              pythonWorker.terminate();
              pythonWorker=null;
              finishRun();
              status.textContent="Python runtime could not be loaded.";
              setOutput(event.message||"Could not load the Python runtime. Check your internet connection and try again.",true);
            },{once:true});
          }
          pythonRunTimer=window.setTimeout(()=>{
            if(pythonWorker){pythonWorker.terminate();pythonWorker=null}
            finishRun();
            status.textContent="Python runtime loading timed out.";
            setOutput("The runtime did not load in time. Check your internet connection and retry.",true);
          },120000);
          pythonWorker.postMessage({type:"run",code:editor.value});
        }catch(error){
          finishRun();
          status.textContent="Python runtime could not be started.";
          setOutput(error.message,true);
        }
      });

    function turnFlipbookPage(direction){

      const isAssignment=activeModuleNumber===0;
      const slideStep=isAssignment?1:2;
      const lastSlide=isAssignment?deck.slides-1:Math.floor((deck.slides-1)/2)*2;
      const nextSlide=Math.max(0,Math.min(lastSlide,activeSlide+direction*slideStep));
